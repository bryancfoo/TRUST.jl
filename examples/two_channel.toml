# Phase 4.A Step 4.A.3c / spec D41: the synthetic two-channel joint fit. Run examples/two_channel.jl
# once first (`julia --project=. examples/two_channel.jl`) to write
# runs/two_channel_{epw,iaw}_streak.jld2, the two synthetic streaks this deck fits -- each one's
# sigma already frozen at synthesis (OQ-14).
#
# The inits below (logn 19.6, T_e 800, m_e 3.0, T_D 300) are MID-RANGE values, not the EPW deck's
# own truth-adjacent inits: starting the joint fit from the EPW deck's inits (logn 19.176, T_e
# 350, m_e 2.5) stalls the optimizer at chi2/n of about 65-144 while it still reports "converged"
# (:f_tolerance) -- D41 amendment 3, dev/phase4A_instructions.md.

deck_version = "trust-deck-2"
channels = ["epw", "iaw"]

[[fit.regions]]
t_range_ns = [2.2, 5.6]
nbins = 32

[channel.epw.data]
file = "runs/two_channel_epw_streak.jld2"
lambda_range_nm = [220.0, 260.0]

[channel.epw.geometry]
lambda_probe_nm = 263.25
theta_deg = 60.0
k_model = "exact"

[channel.epw.instrument]
spectral_irf = { fwhm_nm = 0.5 }
temporal_irf = { fwhm_ns = 0.08 }
sensitivity = { scale = 2.0e-4 }
background = [{ type = "Constant", level = 25.0 }]

[channel.iaw.data]
file = "runs/two_channel_iaw_streak.jld2"
t_shift_ns = 0.05

[channel.iaw.geometry]
lambda_probe_nm = 263.25
theta_deg = 60.0
k_model = "exact"

[channel.iaw.instrument]
spectral_irf = { fwhm_nm = 0.08 }
temporal_irf = { fwhm_ns = 0.05 }
sensitivity = { scale = 1.0e-6 }

[fit.variables]
logn = { bounds = [18.5, 20.5], init = 19.6, time_varying = true }
T_e  = { bounds = [100.0, 2000.0], init = 800.0, time_varying = true }
m_e  = { bounds = [2.0, 5.5], init = 3.0, time_varying = true }
T_D  = { bounds = [50.0, 1500.0], init = 300.0, time_varying = true }

[fit.dependent]
ne_cm3 = "10^logn"

[plasma]
n_e_cm3 = "ne_cm3"

[plasma.electrons.e]
fraction = 1.0
T_eV = "T_e"
u_kms = 0.0
shape = { type = "SuperGaussian", m = "m_e" }

[plasma.ions.D]
mass_amu = 2.014
charge = 1
fraction = 1.0
T_eV = "T_D"
u_kms = 0.0

[regularizer]
weight = 2.0e-4
terms = [
  { select = ["logn", "T_e"], operator = "D2", normalization = "relative" },
  { select = ["m_e"], operator = "D2", normalization = "unit" },
  { select = ["T_D"], operator = "D2", normalization = "relative" },
]

[optimizer]
procedure = "lbfgs"

[output]
dir = "runs/two_channel/joint"
