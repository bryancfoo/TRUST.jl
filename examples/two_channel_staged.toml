# Phase 4.F Step 4.F.1 / spec D8: examples/two_channel.toml, fitted with procedure = "staged"
# (OQ-54, the user's decision of 2026-09-30). Run examples/two_channel.jl once first (`julia
# --project=. examples/two_channel.jl`) to write runs/two_channel_{epw,iaw}_streak.jld2.
#
# fit(deck) fits the EPW channel alone and the IAW channel alone (each with L-BFGS, every variable
# free from the inits below), starts the joint problem from those fits -- T_D from the IAW stage,
# every other variable from the EPW stage, the first channel listed -- then runs
# Levenberg-Marquardt on the joint problem and polishes. From the same inits the plain joint fit
# (examples/two_channel.toml) reports "converged" at EPW and IAW chi2/n 41.9 and 130.4 (Level 2,
# 2026-09-30; Phase 4.A's A20), the staged fit at 3.5 and 2.8 (TS2); the result file carries each
# stage's fit under stages/.

deck_version = "trust-deck-2"
channels = ["epw", "iaw"]

[[fit.regions]]
t_range_ns = [2.2, 5.6]
nbins = 32

[channel.epw.data]
file = "runs/two_channel_epw_streak.jld2"
lambda_range_nm = [220.0, 260.0]

[channel.epw.geometry]
lambda_probe_nm = 263.25
theta_deg = 60.0
k_model = "exact"

[channel.epw.instrument]
spectral_irf = { fwhm_nm = 0.5 }
temporal_irf = { fwhm_ns = 0.08 }
sensitivity = { scale = 2.0e-4 }
background = [{ type = "Constant", level = 25.0 }]

[channel.iaw.data]
file = "runs/two_channel_iaw_streak.jld2"
t_shift_ns = 0.05

[channel.iaw.geometry]
lambda_probe_nm = 263.25
theta_deg = 60.0
k_model = "exact"

[channel.iaw.instrument]
spectral_irf = { fwhm_nm = 0.08 }
temporal_irf = { fwhm_ns = 0.05 }
sensitivity = { scale = 1.0e-6 }

[fit.variables]
logn = { bounds = [18.5, 20.5], init = 19.6, time_varying = true }
T_e  = { bounds = [100.0, 2000.0], init = 800.0, time_varying = true }
m_e  = { bounds = [2.0, 5.5], init = 3.0, time_varying = true }
T_D  = { bounds = [50.0, 1500.0], init = 300.0, time_varying = true }

[fit.dependent]
ne_cm3 = "10^logn"

[plasma]
n_e_cm3 = "ne_cm3"

[plasma.electrons.e]
fraction = 1.0
T_eV = "T_e"
u_kms = 0.0
shape = { type = "SuperGaussian", m = "m_e" }

[plasma.ions.D]
mass_amu = 2.014
charge = 1
fraction = 1.0
T_eV = "T_D"
u_kms = 0.0

[regularizer]
weight = 2.0e-4
terms = [
  { select = ["logn", "T_e"], operator = "D2", normalization = "relative" },
  { select = ["m_e"], operator = "D2", normalization = "unit" },
  { select = ["T_D"], operator = "D2", normalization = "relative" },
]

[optimizer]
procedure = "staged"

[optimizer.staged]
stage_procedure = "lbfgs"
joint_procedure = "levenberg_marquardt"
polish_tol = 1.0e-6
start_from = { T_D = "iaw" }

[output]
dir = "runs/two_channel/staged"
